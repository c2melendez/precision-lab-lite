name: IN625 Lite Build Diagnostic

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Specific build diagnosis not already answered by cumulative evidence'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Require recorded diagnostic reason
        env:
          DIAGNOSTIC_REASON: ${{ inputs.reason }}
        run: |
          python3 -c 'import json, os; reason=os.environ["DIAGNOSTIC_REASON"].strip(); assert reason, "A diagnostic reason is required"; print(json.dumps({"diagnostic_reason": reason}))'
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript and Vite production build
        run: npm run build
