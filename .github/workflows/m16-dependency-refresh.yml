name: M16 dependency refresh

on:
  push:
    branches: [qa/post-track-d-m16]

permissions:
  contents: write

concurrency:
  group: m16-dependency-refresh-lite
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/post-track-d-m16
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh controlled tooling dependencies
        run: npm install --save-dev vite@8.3.0 vitest@5.0.1 @vitejs/plugin-react@6.1.1 vite-plugin-pwa@1.3.0
      - name: Commit package metadata when changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "M16 Lite: actualizar tooling de build y pruebas"
          git push origin HEAD:qa/post-track-d-m16
