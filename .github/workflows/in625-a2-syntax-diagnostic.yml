name: IN625 A1+A2+A3+A4+B1+B2+B3+B4+C1+C2+C3+C4+D1+D2+D3+E1a+E1b+E1c+E1d+E2a Syntax Diagnostic
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run A1+A2+A3+A4+B1+B2+B3+B4+C1+C2+C3+C4+D1+D2+D3+E1a+E1b+E1c+E1d+E2a syntax diagnostics
        run: npx vitest run tests/in625A1Fractions.audit.test.ts tests/in625A2Delimiters.audit.test.ts tests/in625A3Operators.audit.test.ts tests/in625A4Roots.audit.test.ts tests/in625B1Exponents.audit.test.ts tests/in625B2SubscriptsLogs.audit.test.ts tests/in625B3ImplicitMultiplication.audit.test.ts tests/in625B4Precedence.audit.test.ts tests/in625C1FunctionPowers.audit.test.ts tests/in625C2FunctionArguments.audit.test.ts tests/in625C3SpanishAliases.audit.test.ts tests/in625C4ConstantsFunctions.audit.test.ts tests/in625D1Decimals.audit.test.ts tests/in625D2ScientificPercent.audit.test.ts tests/in625D3Precision.audit.test.ts tests/in625E1aDerivatives.audit.test.ts tests/in625E1bLimits.audit.test.ts tests/in625E1cIntegrals.audit.test.ts tests/in625E1dAggregates.audit.test.ts tests/in625E2aMatrices.audit.test.ts
