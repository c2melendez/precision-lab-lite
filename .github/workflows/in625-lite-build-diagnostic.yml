name: IN625 Lite Build Diagnostic

on:
  push:
    branches:
      - qa/syntax-audit-in625-a1
  workflow_dispatch:

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript and Vite production build
        run: npm run build

