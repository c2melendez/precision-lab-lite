name: QA Security Runtime Audit Validation

on:
  push:
    branches: [qa/security-runtime-fix]
    paths:
      - .github/workflows/qa-security-runtime-validation.yml
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/security-runtime-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Runtime audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          npm audit --omit=dev --package-lock-only --json > audit-prod.json
      - name: Publish result to PR 6
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'NODE' > /tmp/runtime-audit.md
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('audit-prod.json','utf8'));
          const m=x.metadata?.vulnerabilities || {};
          console.log('<!-- qa-lite-security-runtime-validation -->');
          console.log('## QA Lite security fix — runtime audit');
          console.log('');
          console.log('- SHA: `'+process.env.GITHUB_SHA+'`');
          console.log('- total: **'+(m.total??0)+'** — critical '+(m.critical??0)+', high '+(m.high??0)+', moderate '+(m.moderate??0)+', low '+(m.low??0));
          console.log('');
          for (const [name,v] of Object.entries(x.vulnerabilities||{})) {
            console.log('- '+name+': '+v.severity+'; direct='+v.isDirect+'; fix='+JSON.stringify(v.fixAvailable));
          }
          NODE
          gh pr comment 6 --repo c2melendez/precision-lab-lite --body-file /tmp/runtime-audit.md
