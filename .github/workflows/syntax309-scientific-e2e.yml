permissions:
  contents: read

jobs:
  scientific-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Validate scientific E2E specs before browser installation
        run: npx playwright test --list e2e/syntax309-*.spec.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
