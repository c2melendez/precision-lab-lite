name: CI

on:
  push:
    branches: [main, master, qa/exhaustive-suite-module-01]
    paths-ignore:
      - '**/*.md'
      - 'README.md'
      - 'qa/certification/continuity.json'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'README.md'
      - 'qa/certification/continuity.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-command-runner-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bridge worker safety contract tests
        run: python -m unittest discover -s scripts -p "test_bridge_command_runner.py"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: QA dependency audit (hard gate)
        run: npm audit --package-lock-only --json > npm-audit.json
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lite-npm-audit
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and parity tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload production build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lite-dist
          path: dist
          if-no-files-found: ignore
          retention-days: 7
