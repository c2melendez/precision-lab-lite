name: CI

on:
  push:
    branches: [main, master, qa/exhaustive-suite-module-01]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: QA dependency audit (hard gate)
        shell: bash
        run: |
          set +e
          npm audit --package-lock-only --json | tee npm-audit.json
          audit_status=${PIPESTATUS[0]}
          exit "$audit_status"
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lite-npm-audit
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and parity tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload production build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lite-dist
          path: dist
          if-no-files-found: ignore
          retention-days: 7
