name: Restore algebriteClient R324
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-algebrite-r324.yml"
      - "qa/certification/R324_factorial_bound.patch"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/syntax-audit-in625-a1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download last-good algebriteClient and apply R324 patch
        run: |
          set -euo pipefail
          GOOD_SHA=44924ff5ef485948eb2a20d547980d393520884c
          curl -fsSL \
            "https://raw.githubusercontent.com/c2melendez/precision-lab-lite/${GOOD_SHA}/src/engine/algebriteClient.ts" \
            -o src/engine/algebriteClient.ts
          # Apply EN-SG-25 factorial complexity bound (same as R324_factorial_bound.patch)
          python3 <<'PY'
          from pathlib import Path
          text = Path("src/engine/algebriteClient.ts").read_text()
          old = '''    // SY-N-23: reject fractional factorial after decimal rationalization.\n    const fractionalFactorial = expressionLatex.match(/factorial\\s*\\(\\s*\\(*\\s*(\\d+)\\s*\\/\\s*(\\d+)\\s*\\)*\\s*\\)/);\n    if (fractionalFactorial && Number(fractionalFactorial[2]) > 0 &&\n        Number(fractionalFactorial[1]) % Number(fractionalFactorial[2]) !== 0) {\n      throw toAppError(ErrorCode.DOMAIN_ERROR, "Factorial no definido para números no enteros; utilice Gamma.");\n    }\n    // IN625 A2: Algebrite no evalúa floor()/ceiling() de forma fiable.'''
          new = '''    // SY-N-23: reject fractional factorial after decimal rationalization.\n    const fractionalFactorial = expressionLatex.match(/factorial\\s*\\(\\s*\\(*\\s*(\\d+)\\s*\\/\\s*(\\d+)\\s*\\)*\\s*\\)/);\n    if (fractionalFactorial && Number(fractionalFactorial[2]) > 0 &&\n        Number(fractionalFactorial[1]) % Number(fractionalFactorial[2]) !== 0) {\n      throw toAppError(ErrorCode.DOMAIN_ERROR, "Factorial no definido para números no enteros; utilice Gamma.");\n    }\n    // EN-SG-25 (Lite R324): reject literal factorial arguments above MAX\n    // before Algebrite expands them. Aligns with Plus scoped bound (1000!).\n    // Never compute the factorial; compare digit strings only.\n    // Patterns: factorial(N), N!, and parenthesized (N)! with optional spaces.\n    const MAX_LITERAL_FACTORIAL = 1000;\n    const factorialArgMatches = [\n      ...expressionLatex.matchAll(/\\bfactorial\\s*\\(\\s*\\(*\\s*(\\d+)\\s*\\)*\\s*\\)/g),\n      ...expressionLatex.matchAll(/(?:^|[^\\w.])(\\d+)\\s*!/g),\n    ];\n    for (const match of factorialArgMatches) {\n      const digits = (match[1] || "").replace(/^0+/, "") || "0";\n      // Compare as integers only when short enough for Number; else reject.\n      if (digits.length > 4 || Number(digits) > MAX_LITERAL_FACTORIAL) {\n        throw toAppError(\n          ErrorCode.COMPLEXITY_LIMIT,\n          `Factorial literal fuera de rango (máximo ${MAX_LITERAL_FACTORIAL}).`,\n        );\n      }\n    }\n    // IN625 A2: Algebrite no evalúa floor()/ceiling() de forma fiable.'''
          if old not in text:
              raise SystemExit("patch anchor not found in downloaded file")
          Path("src/engine/algebriteClient.ts").write_text(text.replace(old, new, 1))
          out = Path("src/engine/algebriteClient.ts").read_text()
          assert "MAX_LITERAL_FACTORIAL" in out
          assert out.startswith("import { verifyFactorResult }")
          print("restored+patched", len(out), "chars")
          PY
      - name: Commit restored file if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/algebriteClient.ts
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix(h2): restore algebriteClient.ts + EN-SG-25 factorial bound (R324)"
            git push
          fi
