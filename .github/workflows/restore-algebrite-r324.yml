name: Restore algebriteClient R324
on:
  workflow_dispatch:
  push:
    paths:
      - "src/engine/.algebrite_fragments/**"
      - "scripts/assemble-algebrite.mjs"
      - ".github/workflows/restore-algebrite-r324.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/syntax-audit-in625-a1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble algebriteClient.ts from fragments
        run: node scripts/assemble-algebrite.mjs
      - name: Commit restored file if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/algebriteClient.ts
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix(h2): restore algebriteClient.ts + EN-SG-25 factorial bound (R324) via fragment assemble"
            git push
          fi
