name: QA Navigation Diagnostic

on:
  push:
    branches: [qa/exhaustive-suite-module-01]
    paths:
      - .github/workflows/qa-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run navigation diagnostic
        shell: bash
        run: |
          set +e
          npx playwright test e2e/diagnostic-navigation.spec.ts --project=desktop-chromium --reporter=line > nav.log 2>&1
          echo $? > nav.exit
          exit 0
      - name: Write snapshot
        if: always()
        shell: bash
        run: |
          mkdir -p .qa-results
          {
            echo "# QA navigation diagnostic — Lite"
            echo
            echo "- workflow_sha: $GITHUB_SHA"
            echo "- exit: $(cat nav.exit 2>/dev/null || echo missing)"
            echo
            echo '~~~text'
            tail -n 500 nav.log 2>/dev/null || true
            echo '~~~'
          } > .qa-results/navigation-latest.md
      - name: Commit snapshot
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C qa/exhaustive-suite-module-01
          git add .qa-results/navigation-latest.md
          git diff --cached --quiet && exit 0
          git commit -m "QA navigation diagnostics [skip ci]"
          git push origin HEAD:qa/exhaustive-suite-module-01
