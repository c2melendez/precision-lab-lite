name: QA Lite Final Gate Reporter

on:
  push:
    branches: [qa/exhaustive-suite-module-01]
    paths:
      - .github/workflows/qa-diagnostics.yml
      - e2e/exhaustive-module03-calculus.spec.ts
      - e2e/exhaustive-module10-keyboard.spec.ts

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        id: tc
        continue-on-error: true
        run: npm run typecheck
      - name: Unit sentinels
        id: unit
        continue-on-error: true
        run: npm test -- tests/parsing.test.ts tests/plusMinus.test.ts
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: M3 M10 all viewports
        id: e2e
        continue-on-error: true
        shell: bash
        run: |
          npx playwright test e2e/exhaustive-module03-calculus.spec.ts e2e/exhaustive-module10-keyboard.spec.ts --reporter=line 2>&1 | tee e2e.log
      - name: Publish result to PR 2
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TC: ${{ steps.tc.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        shell: bash
        run: |
          {
            echo "<!-- qa-lite-final-gate -->"
            echo "## QA Lite — M3/M10 gate"
            echo
            echo "- SHA: \`$GITHUB_SHA\`"
            echo "- typecheck: **$TC**"
            echo "- unit sentinels: **$UNIT**"
            echo "- E2E M3/M10 Desktop+Tablet+Mobile: **$E2E**"
            echo
            echo "### Resumen Playwright"
            echo '~~~text'
            grep -E "([0-9]+ passed|[0-9]+ failed|[0-9]+ flaky|Running [0-9]+ tests|› e2e/)" e2e.log | tail -n 120 || true
            echo '~~~'
          } > /tmp/qa-comment.md
          gh pr comment 2 --repo c2melendez/precision-lab-lite --body-file /tmp/qa-comment.md
