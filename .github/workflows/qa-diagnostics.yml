name: QA Lite M3 Stability Probe

on:
  push:
    branches: [qa/exhaustive-suite-module-01]
    paths:
      - .github/workflows/qa-diagnostics.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Repeat M3 desktop
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          npx playwright test e2e/exhaustive-module03-calculus.spec.ts --project=desktop-chromium --repeat-each=8 --retries=0 --workers=1 --reporter=line 2>&1 | tee probe.log
      - name: Publish probe
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.probe.outcome }}
        shell: bash
        run: |
          {
            echo "<!-- qa-lite-m3-stability -->"
            echo "## QA Lite — M3 stability probe"
            echo
            echo "- SHA: \`$GITHUB_SHA\`"
            echo "- resultado: **$OUTCOME**"
            echo "- ejecución: Desktop, 8 repeticiones, retries=0, workers=1"
            echo
            echo '~~~text'
            grep -E "([0-9]+ passed|[0-9]+ failed|Running [0-9]+ tests|› e2e/)" probe.log | tail -n 140 || true
            echo '~~~'
          } > /tmp/probe.md
          gh pr comment 2 --repo c2melendez/precision-lab-lite --body-file /tmp/probe.md
