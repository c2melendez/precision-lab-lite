name: QA Fast CI Diagnostic

on:
  push:
    branches: [qa/exhaustive-suite-module-01]
    paths:
      - .github/workflows/qa-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/exhaustive-suite-module-01
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run CI diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p .qa-results
          npm ci > npm-ci.log 2>&1
          A=$?
          npm audit --package-lock-only --json > npm-audit.json 2> npm-audit.stderr
          E=$?
          npm run typecheck > typecheck.log 2>&1
          B=$?
          npm test > unit.log 2>&1
          C=$?
          npm run build > build.log 2>&1
          D=$?
          {
            echo "# QA fast CI diagnostic — Lite"
            echo
            echo "- npm_ci: $A"
            echo "- npm_audit: $E"
            echo "- typecheck: $B"
            echo "- unit: $C"
            echo "- build: $D"
            for f in npm-ci typecheck unit build; do
              echo
              echo "## $f"
              echo '~~~text'
              tail -n 260 "$f.log" 2>/dev/null || true
              echo '~~~'
            done
            echo
            echo "## npm audit stderr"
            echo '~~~text'
            tail -n 80 npm-audit.stderr 2>/dev/null || true
            echo '~~~'
            echo
            echo "## npm audit metadata"
            echo '~~~json'
            node -e "const fs=require('fs'); try { const x=JSON.parse(fs.readFileSync('npm-audit.json','utf8')); console.log(JSON.stringify(x.metadata || {},null,2)); } catch(e) { console.log('unavailable: '+e.message) }"
            echo '~~~'
          } > .qa-results/diagnostics-latest.md
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .qa-results/diagnostics-latest.md
          git diff --cached --quiet && exit 0
          git commit -m "QA fast diagnostics [skip ci]"
          git push origin HEAD:qa/exhaustive-suite-module-01

