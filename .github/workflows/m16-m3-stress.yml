name: M16 M3 stress

on:
  push:
    branches: [m16-stabilization]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m3-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Stress M3 without retries
        run: npx playwright test e2e/exhaustive-module03-calculus.spec.ts --repeat-each=10 --retries=0
      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m16-m3-stress-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
