name: QA Dependency Audit Report

on:
  push:
    branches: [qa/exhaustive-suite-module-01]
    paths:
      - .github/workflows/qa-audit-report.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture audit JSON
        shell: bash
        run: |
          set +e
          npm audit --package-lock-only --json > /tmp/audit.json
          echo $? > /tmp/audit.exit
          exit 0
      - name: Build report
        shell: bash
        run: |
          node <<'NODE' > /tmp/detail.txt
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const rows=Object.entries(a.vulnerabilities||{}).map(([name,v])=>({
            name,
            severity:v.severity,
            direct:Boolean(v.isDirect),
            range:v.range,
            fix:v.fixAvailable,
            via:(v.via||[]).map(x=>typeof x==='string'?x:(x.title||x.name||x.source)).join(' | ')
          }));
          const rank={critical:4,high:3,moderate:2,low:1,info:0};
          rows.sort((a,b)=>(rank[b.severity]||0)-(rank[a.severity]||0)||a.name.localeCompare(b.name));
          console.log(JSON.stringify({metadata:a.metadata,rows},null,2));
          NODE
      - name: Upload full audit
        uses: actions/upload-artifact@v4
        with:
          name: lite-npm-audit-full
          path: /tmp/audit.json
          retention-days: 14
      - name: Comment PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "<!-- qa-lite-audit-detail -->"
            echo "## QA Lite — detalle npm audit"
            echo
            echo "- SHA: \`$GITHUB_SHA\`"
            echo
            echo '~~~json'
            cat /tmp/detail.txt
            echo '~~~'
            echo
            echo "El JSON completo queda retenido como artefacto \`lite-npm-audit-full\`."
          } > /tmp/comment.md
          gh pr comment 2 --repo c2melendez/precision-lab-lite --body-file /tmp/comment.md
