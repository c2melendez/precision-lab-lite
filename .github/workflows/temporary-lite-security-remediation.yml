name: Temporary Lite dependency remediation validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/temporary-lite-security-remediation.yml

permissions:
  contents: write

jobs:
  validate-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the Lite M2 branch
        uses: actions/checkout@v4
        with:
          ref: feature/m2-command-runner-bridge
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean dependency installation
        run: npm ci
      - name: Record the remaining dependency audit findings without waiving the hard gate
        shell: bash
        run: |
          set +e
          npm audit --package-lock-only --json > npm-audit.json
          audit_status=$?
          set -e
          node -e 'const a=require("./npm-audit.json"); const v=a.metadata?.vulnerabilities||{}; console.log(JSON.stringify(v));'
          echo "npm audit exit status: ${audit_status}" >> "$GITHUB_STEP_SUMMARY"
          echo "This diagnostic workflow reports audit status only. The normal CI and Runner profiles retain the npm audit hard gate." >> "$GITHUB_STEP_SUMMARY"
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and parity tests
        run: npm test
      - name: Production build and PWA generation
        run: npm run build
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lite-security-remediation-audit
          path: npm-audit.json
          retention-days: 7
      - name: Upload PWA output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lite-security-remediation-pwa-dist
          path: dist
          retention-days: 7
      - name: Commit regenerated lockfile after validation
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches the updated manifest."
            exit 0
          fi
          git commit -m "fix(deps): synchronize Lite security remediation lockfile"
          git push origin HEAD:refs/heads/feature/m2-command-runner-bridge
