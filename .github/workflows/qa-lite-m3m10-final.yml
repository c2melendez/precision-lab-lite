name: QA Lite M3 M10 Final

on:
  push:
    branches: [qa/exhaustive-suite-module-01]
    paths:
      - .github/workflows/qa-lite-m3m10-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/exhaustive-suite-module-01
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run M3 and M10
        shell: bash
        run: |
          set +e
          mkdir -p .qa-results
          npx playwright test e2e/exhaustive-module03-calculus.spec.ts e2e/exhaustive-module10-keyboard.spec.ts --reporter=line > m3m10-final.log 2>&1
          CODE=$?
          {
            echo "# Lite M3/M10 final"
            echo
            echo "- workflow_sha: $GITHUB_SHA"
            echo "- e2e_exit: $CODE"
            echo
            echo '~~~text'
            tail -n 650 m3m10-final.log
            echo '~~~'
          } > .qa-results/m3m10-final.md
          exit 0
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .qa-results/m3m10-final.md
          git diff --cached --quiet && exit 0
          git commit -m "QA M3 M10 final result [skip ci]"
          git push origin HEAD:qa/exhaustive-suite-module-01

