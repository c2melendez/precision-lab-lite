name: Isolated Workbox glob remediation diagnostic

on:
  push:
    branches:
      - security/lite-workbox-glob-remediation-20261105

permissions:
  contents: write

jobs:
  regenerate-validate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated security branch
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile with scoped Workbox override
        shell: bash
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install exact lockfile
        run: npm ci
      - name: Inspect resolved packages
        continue-on-error: true
        shell: bash
        run: |
          npm ls glob minimatch workbox-build --all > npm-dependency-tree.txt 2>&1
          rc=$?
          echo "$rc" > npm-ls-exit-code.txt
          cat npm-dependency-tree.txt
      - name: Audit all dependencies
        shell: bash
        run: |
          npm audit --package-lock-only --json > npm-audit.json
          rc=$?
          echo "$rc" > npm-audit-exit-code.txt
          echo "npm_audit_exit_code=$rc"
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit and regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit validated package lock in isolated branch
        if: success()
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches the validated dependency graph"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: persist validated Workbox glob lockfile"
          git push origin HEAD:security/lite-workbox-glob-remediation-20261105
      - name: Upload lockfile and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-lock-regeneration
          path: |
            package-lock.json
            npm-dependency-tree.txt
            npm-ls-exit-code.txt
            npm-audit.json
            npm-audit-exit-code.txt
          if-no-files-found: warn
          retention-days: 7
