name: Isolated Workbox glob remediation diagnostic

on:
  push:
    branches:
      - security/lite-workbox-glob-remediation-20261105

permissions:
  contents: read

jobs:
  regenerate-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated security branch
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile with scoped Workbox override
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm install --package-lock-only --ignore-scripts --no-audit
          rc=$?
          echo "$rc" > npm-install-exit-code.txt
          echo "npm_install_exit_code=$rc"
      - name: Inspect resolved packages
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm ls glob minimatch workbox-build --all > npm-dependency-tree.txt 2>&1
          rc=$?
          echo "$rc" > npm-ls-exit-code.txt
          cat npm-dependency-tree.txt
      - name: Run dependency audit without suppressing failures
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          rc=$?
          echo "$rc" > npm-audit-exit-code.txt
          echo "npm_audit_exit_code=$rc"
          npm audit --omit=dev --json > npm-audit-production.json
          prod_rc=$?
          echo "$prod_rc" > npm-audit-production-exit-code.txt
          echo "npm_audit_production_exit_code=$prod_rc"
      - name: Upload lockfile and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-lock-regeneration
          path: |
            package-lock.json
            npm-install-exit-code.txt
            npm-dependency-tree.txt
            npm-ls-exit-code.txt
            npm-audit.json
            npm-audit-exit-code.txt
            npm-audit-production.json
            npm-audit-production-exit-code.txt
          if-no-files-found: warn
          retention-days: 7
