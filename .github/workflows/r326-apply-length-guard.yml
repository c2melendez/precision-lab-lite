name: R326 Apply EN-SG-21 length guard
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/syntax-audit-in625-a1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch if not already present
        run: |
          if grep -q 'MAX_EXPRESSION_LENGTH' src/engine/algebriteClient.ts; then
            echo "Already applied"
            exit 0
          fi
          git apply qa/certification/R326_expression_length.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/algebriteClient.ts
          git commit -m "fix(h2): apply R326 MAX_EXPRESSION_LENGTH=500 guard to algebriteClient"
          git push
