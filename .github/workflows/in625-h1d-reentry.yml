name: IN625 H1d Reentry Diagnostic

on:
  push:
    branches:
      - qa/syntax-audit-in625-a1
    paths-ignore:
      - 'qa/certification/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h1d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0 @axe-core/playwright@4.13.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run IN625 H1d reentry
        run: npx playwright test e2e/in625-h1d-reentry.spec.ts --project desktop-chromium
