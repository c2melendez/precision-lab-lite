name: Cross-browser smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit
      - name: Run cross-browser smoke
        run: npx playwright test --config=playwright.cross-browser.config.ts
      - name: Upload cross-browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lite-playwright-cross-browser-report
          path: |
            playwright-report-cross-browser/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
