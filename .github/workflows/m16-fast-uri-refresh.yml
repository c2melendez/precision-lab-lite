name: M16 Refresh fast-uri

on:
  push:
    branches:
      - m16/tooling-upgrade-stage1

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[m16-fast-uri-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m16/tooling-upgrade-stage1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Refresh compatible fast-uri transitively
        run: npm update fast-uri --package-lock-only
      - name: Audit refreshed lockfile
        run: npm audit --package-lock-only --json > m16-audit-after-fast-uri.json || true
      - name: Commit lockfile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change."
            exit 0
          fi
          git commit -m "M16 refresh fast-uri [m16-fast-uri-refresh]"
          git push origin HEAD:m16/tooling-upgrade-stage1
