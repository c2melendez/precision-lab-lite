name: M16 Tooling Upgrade Bootstrap

on:
  push:
    branches:
      - m16/tooling-upgrade-stage1

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[m16-lock-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m16/tooling-upgrade-stage1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Upgrade tooling and regenerate lockfile
        run: |
          npm install -D vite@7.3.6 vitest@5.0.1 vite-plugin-pwa@1.3.0 @vitejs/plugin-react@5.2.0
      - name: Validate install metadata
        run: |
          npm ls vite vitest vite-plugin-pwa @vitejs/plugin-react
          npm audit --package-lock-only --json > m16-audit.json || true
      - name: Commit regenerated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "M16 tooling stage 1 [m16-lock-refresh]"
          git push origin HEAD:m16/tooling-upgrade-stage1
