name: QA E2E Diagnostic

on:
  push:
    branches: [qa/exhaustive-suite-module-01]
    paths:
      - .github/workflows/qa-e2e-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/exhaustive-suite-module-01
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run directed E2E
        id: e2e
        continue-on-error: true
        run: npx playwright test e2e/exhaustive-module03-calculus.spec.ts e2e/exhaustive-module09-graphing.spec.ts e2e/exhaustive-module10-keyboard.spec.ts e2e/exhaustive-module12-personalization-a11y.spec.ts --reporter=line > e2e-directed.log 2>&1

      - name: Write E2E snapshot
        if: always()
        run: |
          mkdir -p .qa-results
          {
            echo "# QA E2E diagnostic — Lite"
            echo
            echo "- outcome: ${{ steps.e2e.outcome }}"
            echo
            echo "## directed E2E"
            echo '~~~text'
            tail -n 500 e2e-directed.log 2>/dev/null || true
            echo '~~~'
          } > .qa-results/e2e-latest.md

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .qa-results/e2e-latest.md
          git diff --cached --quiet && exit 0
          git commit -m "QA E2E snapshot [skip ci]"
          git push origin HEAD:qa/exhaustive-suite-module-01
